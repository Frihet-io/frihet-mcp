# Smithery configuration for Frihet ERP MCP Server
# https://smithery.ai/servers/frihet/frihet-mcp

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      FRIHET_API_KEY:
        type: string
        description: Frihet API key from https://app.frihet.io/settings/api
    required: []
  commandFunction:
    - npx
    - -y
    - "@frihet/mcp-server@latest"
