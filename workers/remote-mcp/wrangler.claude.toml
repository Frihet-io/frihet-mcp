# Source candidate only. The release guard refuses the dry-run namespace below.
name = "frihet-claude-mcp"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "claude-mcp.frihet.io/*", zone_name = "frihet.io" }]

[alias]
"@cloudflare/workers-oauth-provider" = "./.wrangler/claude-oauth-provider.js"
"zod" = "../../node_modules/zod"
"zod/v3" = "../../node_modules/zod/v3"
"zod/v4" = "../../node_modules/zod/v4"
"zod/v4-mini" = "../../node_modules/zod/v4-mini"
"zod/v4/core" = "../../node_modules/zod/v4/core"

[build]
command = "node ../../scripts/prepare-claude-oauth-provider.mjs"

[vars]
FRIHET_OPENAI_MODE = "false"
FRIHET_CLAUDE_MODE = "true"
FRIHET_TOOL_MODE = "grouped"
FIREBASE_PROJECT_ID = "gen-lang-client-0335716041"

[observability]
enabled = true

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "FrihetMCP" },
  { name = "OAUTH_STATE", class_name = "OAuthStateStore" }
]

[[migrations]]
new_sqlite_classes = ["FrihetMCP"]
tag = "v1"

[[migrations]]
new_sqlite_classes = ["OAuthStateStore"]
tag = "v2"

[[kv_namespaces]]
binding = "OAUTH_KV"
# Replace only after the owner approves an isolated namespace bootstrap.
id = "00000000000000000000000000000000"
