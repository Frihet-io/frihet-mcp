name = "frihet-remote-mcp"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "mcp.frihet.io/*", zone_name = "frihet.io" }]

# DUAL-PACKAGE ZOD FIX (2026-07-18). This worker is a standalone npm project
# with its OWN node_modules/zod, but it bundles tool code from the ROOT package
# (../../../src/tools/*, which imports "zod/v4" → root's zod). The MCP SDK's
# JSON-Schema converter imports "zod/v4-mini" → the WORKER's zod. Zod v4 keeps
# .describe() metadata in a MODULE-SINGLETON global registry keyed by object
# identity, so two physical zod copies = two registries: descriptions are
# written into root's registry but read from the worker's → every tools/list
# param description is silently dropped (types/enums survive). This aliased all
# "zod" imports to the SINGLE root copy so the tool code and the SDK share one
# registry and param descriptions survive serialization. Verify after any dep
# change: the built bundle must contain exactly ONE zod/v4/core/registries.js.
[alias]
"zod" = "../../node_modules/zod"
"zod/v4" = "../../node_modules/zod/v4"
"zod/v4-mini" = "../../node_modules/zod/v4-mini"
"zod/v4/core" = "../../node_modules/zod/v4/core"

# Agent-facing endpoint runs grouped tool-exposure (progressive disclosure):
# tools/list returns terse summaries + 3 discovery meta-tools instead of the
# flat full-catalogue wall. Full depth served on demand via describe_tool/search_tools.
# Read by resolveToolMode() in src/index.ts. npm package stays "full" (local
# clients manage their own context). Rollback = remove this var + redeploy.
# NOTE: top-level [vars] are NOT inherited by [env.openai] (it defines its own
# [env.openai.vars]) — openai-mcp grouped must be set explicitly there.
[vars]
FRIHET_TOOL_MODE = "grouped"
# Explicit fail-closed profile binding. The Worker refuses any missing or
# mistyped value instead of silently serving the full catalogue.
FRIHET_OPENAI_MODE = "false"

# Static assets for AI-discoverability surface (Wave 1)
# Serves public/ directory via env.ASSETS Fetcher binding.
# Covers: releases.json (pre-distributed from manifest emit)
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "FrihetMCP" },
  { name = "OAUTH_STATE", class_name = "OAuthStateStore" }
]

[[migrations]]
new_sqlite_classes = ["FrihetMCP"]
tag = "v1"

[[migrations]]
new_sqlite_classes = ["OAuthStateStore"]
tag = "v2"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "9207b98598f849109139ad11f3b0ac51"

[dev]
port = 8788

# OpenAI-safe deployment: wrangler deploy --env openai
# Serves at openai-mcp.frihet.io with the frozen reviewed business surface.
# Gov IDs stripped, openWorldHint corrected, credentials redacted.
[env.openai]
name = "frihet-openai-mcp"
routes = [{ pattern = "openai-mcp.frihet.io/*", zone_name = "frihet.io" }]
workers_dev = false
preview_urls = false

[env.openai.vars]
FRIHET_OPENAI_MODE = "true"
# "grouped" — the two profiles NOW COMPOSE (see src/index.ts init wiring +
# src/__tests__/openai-grouped-compose.test.ts). applyToolExposureProfile runs
# FIRST (allowlist = the 33 reviewed tools) so its 3 discovery meta-tools
# (search_tools / describe_tool / list_tool_groups) register on the REAL server
# and BYPASS the OpenAI allow-list gate; applyOpenAIProfile runs SECOND so each
# business tool is redacted + safety-annotated, THEN collapsed (the
# collapse re-derives the openWorldHint rationale so it survives, and the OpenAI
# handler-redaction wrapper is preserved). The grouped catalog is pinned to the
# allow-list, so progressive disclosure can never surface a tool outside the 36.
# Live surface = 33 reviewed business tools + 3 read-only closed-world meta-tools
# (36 total). Meta-tools are discovery plumbing, not business capability.
# Any semantic descriptor change requires a new OpenAI draft, scan, and review.
FRIHET_TOOL_MODE = "grouped"

# DO and KV are NOT inherited — must be redeclared
[env.openai.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "FrihetMCP" },
  { name = "OAUTH_STATE", class_name = "OAuthStateStore" }
]

[[env.openai.kv_namespaces]]
binding = "OAUTH_KV"
# Dedicated namespace: OAuth clients, grants and tokens from the reviewed host
# must never resolve on the full mcp.frihet.io host (or vice versa).
id = "7df4e387eee243268669425594aae45e"

# Assets binding must be re-declared per env (same as DO and KV — not inherited).
# OpenAI mode ships a scoped release-metadata bundle. `/openapi.json` runs
# through the Worker and intentionally returns 404: MCP metadata is the sole
# reviewed contract, avoiding a parallel REST surface that can drift.
[env.openai.assets]
directory = "./public-openai"
binding = "ASSETS"
run_worker_first = ["/openapi.json"]
