name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Build · Test · Drift audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # This runs before npm reads either lockfile. The parser-backed gate also
      # pins the same hashes, but cannot load TypeScript until dependencies have
      # been installed. Exact pre-install hashes close that bootstrap gap.
      - name: Lockfile integrity (pre-install)
        run: |
          test ! -e npm-shrinkwrap.json
          test ! -e .npmrc
          test ! -e workers/remote-mcp/npm-shrinkwrap.json
          test ! -e workers/remote-mcp/.npmrc
          echo "5b470bfb050e31694d7d0239cd93e001ccee4d998295be19faf7801925c4711c  package-lock.json" | sha256sum --check --strict -
          echo "52a7213f179d74b6865b6eab7dd432d498e870cb380c688baa4db14de802d735  workers/remote-mcp/package-lock.json" | sha256sum --check --strict -

      - name: Install
        # Lifecycle hooks are executable supply-chain surface. Install the
        # parser dependency inertly; the analytics gate below first scans and
        # freezes the one published postinstall entrypoint.
        run: npm ci --ignore-scripts

      - name: No public leak (competitor comparison / business secret)
        run: bash scripts/no-public-leak.sh

      # Parser-backed and fail-closed: ordinary processor disclosure prose is
      # legal, while executable analytics SDK/config/endpoint/emitter shapes or
      # any drift from the reviewed outbound-sink inventory turn CI red.
      - name: Analytics tripwire (no unregistered emitters)
        run: |
          node --test scripts/__tests__/analytics-tripwire.test.mjs
          node scripts/check-no-analytics-emitters.mjs

      - name: Build
        run: npm run build

      - name: Analytics tripwire (published build artifacts)
        run: node scripts/check-no-analytics-emitters.mjs --built

      - name: Test
        run: npm test

      # Discovery-artifact truth for the two Workers that publish agents.json
      # and ai.txt (#145): canonical /es/ legal URLs on BOTH hosts, and no
      # rate-limit claim that no code enforces. Run as its own step because the
      # root `npm test` list does not cover workers/, so nothing here executed
      # this gate before — and an unenforced gate is how /legal/* stayed
      # published as a 404 on api.frihet.io.
      #
      # Invoked directly rather than through the Worker's package script: this
      # file imports only node: builtins, so it needs no `npm ci` in
      # workers/remote-mcp. The rest of that suite is still not covered by CI
      # (pre-existing gap, tracked separately).
      #
      # Plain .mjs with an explicit path, deliberately: this job pins Node 20,
      # which supports neither `--experimental-strip-types` (Node 22.6+) nor
      # glob arguments to `--test`. The Worker's own `npm test` uses both, which
      # is fine locally but would fail here.
      - name: Discovery artifact truth (workers legal URLs + rate-limit claim)
        run: node --test workers/remote-mcp/src/__tests__/discovery-legal-truth.test.mjs

      # Anti-false-green gate for the official conformance baseline (#1578
      # Phase 0). Offline on purpose: it validates the COMMITTED artifact rather
      # than re-running the harness, which needs network (npx fetches the pinned
      # conformance/Inspector packages) and spawns the server. Re-running the
      # real harness is `npm run conformance:phase0:check`, done locally.
      #
      # What it catches: a baseline with zero scenarios, an unparsed result, a
      # FAILURE relabelled as PASS or NOT_APPLICABLE without evidence, and a
      # matrix with no version metadata to say what it measured.
      - name: Conformance baseline anti-false-green gate
        run: npm run gate:conformance-baseline

      - name: OpenAI review descriptor freeze
        run: npm run gate:openai-review-descriptor

      - name: OpenAI submission artifact parity
        run: npm run gate:openai-submission

      - name: Generated public capability truth
        run: npm run gate:public-capability-truth

      # Agent-onboarding truth gate. docs/agent-onboarding.json is a projection
      # of the live MCP surface (confirm guards, external side effects, counts),
      # not a parallel claim about it: hand-editing the file, or adding a confirm
      # guard without regenerating, turns this red.
      - name: Agent onboarding descriptor parity
        run: npm run gate:agent-onboarding

      # Version/tool-count drift gate. Scoped to this repo: sister repos
      # (Frihet-ERP/Saas/docs) aren't checked out in CI, so we only assert the
      # package's OWN refs (server.json, README, index.ts, CHANGELOG) match the
      # package.json SoT. Cross-repo drift is caught by the local pre-publish run.
      - name: Drift audit (self)
        run: npm run audit:mcp-refs -- --repo frihet-mcp
