name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-audit:
    name: Build · Test · Drift audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: No public leak (competitor comparison / business secret)
        run: bash scripts/no-public-leak.sh

      # Tripwire: this repo has NO analytics contract. Any PostHog/ingest
      # emitter reference in src/ or workers/ turns CI red until the emitter
      # is registered in the Frihet-ERP contract (surface mcp) with its own
      # snapshot+gate, like Frihet-Saas-Website.
      - name: Analytics tripwire (no unregistered emitters)
        run: bash scripts/analytics-tripwire.sh

      # `id` is load-bearing: the gates below key their `if:` on this step's
      # outcome, so a compile error skips them instead of reporting a misleading
      # gate failure that is really just a broken build.
      - name: Build
        id: build
        run: npm run build

      # ORDER MATTERS, AND IT IS DELIBERATE. A step that exits non-zero aborts the
      # job, so every gate placed after `npm test` only ever runs when the suite is
      # already green — i.e. exactly never on the PRs that need it most. The schema
      # parity gate was originally added AFTER Test and therefore never executed a
      # single time on the branch that introduced it. Independent gates now run
      # BEFORE the suite, and each carries `if: always()` so one red gate cannot
      # mask the verdict of the others: a PR gets the FULL list of what is broken
      # in one run instead of discovering it one CI round-trip at a time.
      #
      # Do not "simplify" this by dropping the `if: always()` guards.

      # Output-contract drift gate: replays checked-in REAL backend response
      # bodies through a real FrihetClient + the real tool handlers and validates
      # each tool's structuredContent against its declared outputSchema. Offline
      # (node:http on 127.0.0.1) — no credentials, no network, PR-blocking.
      # Its PASS line names how many tools it scanned and how many are UNCOVERED.
      - name: Schema parity (MCP outputSchemas vs real backend responses)
        if: always() && steps.build.outcome == 'success'
        run: node scripts/schema-parity-gate.mjs

      - name: OpenAI review descriptor freeze
        if: always() && steps.build.outcome == 'success'
        run: npm run gate:openai-review-descriptor

      - name: Test
        if: always() && steps.build.outcome == 'success'
        run: npm test

      # Version/tool-count drift gate. Scoped to this repo: sister repos
      # (Frihet-ERP/Saas/docs) aren't checked out in CI, so we only assert the
      # package's OWN refs (server.json, README, index.ts, CHANGELOG) match the
      # package.json SoT. Cross-repo drift is caught by the local pre-publish run.
      - name: Drift audit (self)
        run: npm run audit:mcp-refs -- --repo frihet-mcp
